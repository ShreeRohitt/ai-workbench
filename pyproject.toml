[project]
name = "ai-workbench"
version = "0.1.0"
description = "Applied AI / data science portfolio projects with measured results"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "openai",
    "pandas>=3.1.0",
    "pydantic>=2",
    "python-dotenv",
    "scikit-learn>=1.9.1",
    "shap>=0.51.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "projects/03-attrition-model"]
testpaths = ["shared", "projects"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "rag", "attrition"]
