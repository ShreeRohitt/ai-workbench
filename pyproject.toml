[project]
name = "ai-workbench"
version = "0.1.0"
description = "Applied AI / data science portfolio projects with measured results"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "numpy>=2.4.6",
    "openai",
    "pydantic>=2",
    "python-dotenv",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "projects/01-rag-with-evals"]
testpaths = ["shared", "projects"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
